<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#030712" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>404 — Página não encontrada | Nour</title>
    <link rel="icon" type="image/png" href="/assets/brand/nour-icon.png" />
    <link rel="stylesheet" href="/assets/styles/base.css" />
    <link rel="stylesheet" href="/assets/styles/identity.css" />
    <link rel="stylesheet" href="/assets/styles/404.css" />
  </head>
  <body class="error-page">
    <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
    <header class="error-header">
      <div class="shell error-nav">
        <a class="brand" href="https://nourcrypto.com.br/" aria-label="Nour — página inicial">
          <img src="/assets/brand/nour-logo.png" alt="Nour" width="803" height="248" />
        </a>
      </div>
    </header>
    <main id="conteudo" class="error-main" tabindex="-1">
      <div class="shell error-layout">
        <div class="error-copy">
          <p class="error-code" aria-hidden="true">404</p>
          <h1>404 — Página não encontrada</h1>
          <p class="error-description">O endereço que você tentou acessar não existe ou não está mais disponível.</p>
          <a class="button button-primary" href="https://nourcrypto.com.br/">
            Voltar para a página inicial
            <span aria-hidden="true">→</span>
          </a>
        </div>
        <div class="error-mark" aria-hidden="true">
          <span class="error-ring error-ring-outer"></span>
          <span class="error-ring error-ring-inner"></span>
          <img src="/assets/brand/nour-icon.png" alt="" width="591" height="537" />
        </div>
      </div>
    </main>
  </body>
</html>
